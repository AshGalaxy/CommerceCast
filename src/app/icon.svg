<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Smooth drop shadow for the logo mark -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Deep Slate Background (Universal Premium SaaS styling) -->
  <rect width="512" height="512" rx="128" fill="#020617" />
  
  <g transform="translate(156, 156) scale(2)" filter="url(#shadow)">
    <!-- Abstract Origami Infinity Fold -->
    <path 
      d="
        M 10 50 
        L 30 30 
        L 70 70 
        L 90 50 
        L 70 30 
        L 30 70 
        Z
      " 
      fill="none"
      stroke="#ffffff" 
      stroke-width="12" 
      stroke-linejoin="miter"
      stroke-miterlimit="4"
    />
    
    <!-- Central Data Core -->
    <polygon 
      points="50,38 62,50 50,62 38,50" 
      fill="#ffffff" 
    />
  </g>
</svg>
